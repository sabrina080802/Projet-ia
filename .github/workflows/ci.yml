name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  training:
    name: Lint, format & test (training)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Black format check
        run: black --check .

      - name: Pytest
        run: pytest -q

      - name: Ruff lint (serving backend)
        run: ruff check --config pyproject.toml ../serving/backend

      - name: Black format check (serving backend)
        run: black --check --config pyproject.toml ../serving/backend
