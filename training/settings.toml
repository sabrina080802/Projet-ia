# Non-secret configuration for the SHARP training pipelines.
# Loaded by config.py via dynaconf. Secrets (API keys) live in .secrets.toml.
# Any value can be overridden by an environment variable prefixed with SHARP_,
# e.g. SHARP_TRAIN__EPOCHS=50 or SHARP_ULTRALYTICS__DATASET_ID=abc123.

# Ultralytics Platform (platform.ultralytics.com). The legacy HUB is wound down
# end of July 2026. The ul:// references below are built from these slugs:
#   dataset -> ul://<username>/datasets/<dataset>
#   model   -> ul://<username>/<project>/<model>
# Find the exact slugs on your dataset/model pages in the Platform UI.
[ultralytics]
# Platform account handle: the <username> segment of every ul:// URI.
username = "your-username"
# Dataset slug, source of truth for both pipelines.
dataset = "your-dataset"
# Project slug that holds the trained models (created by `cloud setup`).
project = "your-project"
# Model slug created under the project (created by `cloud setup`).
model = "your-model"
# Base architecture trained on the Platform; matches the local pipeline's model.
base_model = "yolo11n.pt"
# Default GPU for REST cloud-GPU training (yolo26 GPUs: rtx-pro-6000, rtx-4090,
# a100-80gb-sxm, h100-sxm, ...); ignored by local + streaming training.
gpu_type = "rtx-pro-6000"
# REST ids, filled in after `cloud setup` creates the project/model (or set manually).
project_id = ""
model_id = ""

[data]
# Working directories for the LOCAL pipeline.
root = "data"            # everything below lives under training/data/
raw_dir = "data/raw"     # dataset as downloaded from the SDK
yolo_dir = "data/yolo"   # prepared YOLO-format dataset (images/ + labels/ + data.yaml)
seed = 42
train_ratio = 0.6
val_ratio = 0.2
test_ratio = 0.2
# Canonical classes, fixed by the project statement and shared by both pipelines.
class_names = ["0_doigt", "1_doigt", "2_doigts", "3_doigts", "4_doigts", "5_doigts"]

[train]
# YOLO11 nano keeps inference >= 10 FPS on modest hardware; bump to s/m if accuracy is low.
model = "yolo11n.pt"
epochs = 100
imgsz = 640
batch = -1               # -1 lets Ultralytics auto-pick the batch size.
patience = 20
device = ""              # "" -> auto-detect (cuda > mps > cpu).
project = "runs"
name = "sharp"

[augment]
# Data augmentation, tuned for hand/finger detection. Color jitter handles skin
# tones and lighting; small geometric jitter handles tilt/position; fliplr is
# safe because mirroring a hand does not change its finger count, whereas flipud
# is disabled (upside-down hands are unrealistic for this task).
hsv_h = 0.015
hsv_s = 0.7
hsv_v = 0.4
degrees = 10.0
translate = 0.1
scale = 0.5
fliplr = 0.5
flipud = 0.0
mosaic = 1.0
mixup = 0.0

[infer]
conf = 0.25
iou = 0.45
imgsz = 640
