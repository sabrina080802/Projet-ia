[project]
name = "sharp-training"
version = "0.1.0"
description = "SHARP training pipelines (local + Ultralytics Platform cloud) for finger detection."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    # >=8.4.60 is required for Ultralytics Platform integration (ul:// URIs).
    "ultralytics>=8.4.60",
    "dynaconf>=3.2.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "black>=24.0",
    "pytest>=8.0",
    "pre-commit>=3.7",
]

[project.scripts]
sharp = "run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["run", "config"]
packages = ["sharp", "sharp.cloud", "sharp.local"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
